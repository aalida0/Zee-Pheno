name: Official HiggsTools Zee pilot
on:
  push:
    branches:
      - research/spheno-higgstools-pilot
      - research/higgs-production-decay-validation
      - research/higgs-statistical-screen
    paths:
      - .github/workflows/higgstools-pilot.yml
      - ZeeHiggs/higgstools_pilot.py
      - ZeeHiggs/diagnose_h125.py
      - ZeeHiggs/validate_reference.py
      - ZeeHiggs/higgsbounds_preferred.py
      - ZeeHiggs/hdecay_sm_reference.py
      - ZeeHiggs/compare_hdecay.py
      - ZeeHiggs/spheno_audit.py
      - Higgs/run_hdecay_SM_reference.sh
      - Higgs/install_higgstools.sh
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned official HiggsTools v1.3 and HB/HS datasets
        run: |
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          export MAKEFLAGS="-j2"
          bash Higgs/install_higgstools.sh "$RUNNER_TEMP/zee-higgstools"
      - name: Run audited native NO/IO HiggsTools
        run: |
          "$RUNNER_TEMP/zee-higgstools/venv/bin/python" -m ZeeHiggs.higgstools_pilot \
            --hbdataset "$RUNNER_TEMP/zee-higgstools/hbdataset" \
            --hsdataset "$RUNNER_TEMP/zee-higgstools/hsdataset" \
            --order both \
            --output "$RUNNER_TEMP/zee-higgstools-native-pilot.json"
          "$RUNNER_TEMP/zee-higgstools/venv/bin/python" -m json.tool "$RUNNER_TEMP/zee-higgstools-native-pilot.json"
      - name: Diagnose h125 width and correlated HiggsSignals measurements
        run: |
          "$RUNNER_TEMP/zee-higgstools/venv/bin/python" -m ZeeHiggs.diagnose_h125 \
            --hsdataset "$RUNNER_TEMP/zee-higgstools/hsdataset" \
            --output "$RUNNER_TEMP/zee-h125-widths-chi2-diagnostic.json"
          "$RUNNER_TEMP/zee-higgstools/venv/bin/python" - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"zee-h125-widths-chi2-diagnostic.json").read_text())
          for p in r["points"]:
              print("PILOT",p["point_id"],"Gamma_exp",p["HiggsTools_explicit"]["width_GeV"],
                    "Gamma_eff",p["HiggsTools_effective"]["width_GeV"],
                    "DeltaChi2_exp_eff",p["higgsSignals_delta"]["explicit_vs_effective"])
              print("TOP CHI2 SOURCES")
              for m in p["per_measurement_correlated_chi2"][:8]:
                  print(m["id"],m["reference"],m["delta_explicit_vs_effective"],m["delta_effective_vs_SM"])
              print("SINGLE CHANNEL SENSITIVITIES")
              for m in p["partial_width_one_at_a_time_diagnostics"][:6]:
                  print(m["replaced_partial_width_channel"],m["ratio_SPheno_to_effective_Gamma"],
                        m["delta_chi2_vs_effective"])
          PY
      - name: Validate native SPheno vs HXSWG-normalized Higgs production and decay
        run: |
          "$RUNNER_TEMP/zee-higgstools/venv/bin/python" -m ZeeHiggs.validate_reference \
            --hsdataset "$RUNNER_TEMP/zee-higgstools/hsdataset" \
            --output "$RUNNER_TEMP/zee-h125-reference-comparison.json"
          "$RUNNER_TEMP/zee-higgstools/venv/bin/python" -m json.tool "$RUNNER_TEMP/zee-h125-reference-comparison.json" | head -n 10
      - name: Recompute official HiggsBounds at preferred HXSWG h125 ggF
        run: |
          "$RUNNER_TEMP/zee-higgstools/venv/bin/python" -m ZeeHiggs.higgsbounds_preferred \
            --hbdataset "$RUNNER_TEMP/zee-higgstools/hbdataset" \
            --output "$RUNNER_TEMP/zee-higgsbounds-hxswg-s00017.json"
          "$RUNNER_TEMP/zee-higgstools/venv/bin/python" -m json.tool "$RUNNER_TEMP/zee-higgsbounds-hxswg-s00017.json" > /dev/null
      - name: Upload actual official numerical results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: s00017-higgstools-actual-numerical-pilot
          path: |
            ${{ runner.temp }}/zee-higgstools-native-pilot.json
            ${{ runner.temp }}/zee-h125-widths-chi2-diagnostic.json
            ${{ runner.temp }}/zee-h125-reference-comparison.json
            ${{ runner.temp }}/zee-higgsbounds-hxswg-s00017.json
          if-no-files-found: error
