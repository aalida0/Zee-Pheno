name: HiggsTools pinned input source audit
on:
  push:
    branches:
      - research/spheno-higgstools-pilot
    paths:
      - .github/workflows/higgstools-source-audit.yml
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact HiggsTools v1.3 Python input path
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3 https://gitlab.com/higgsbounds/higgstools.git /tmp/higgstools-v1.3
          git -C /tmp/higgstools-v1.3 rev-parse HEAD
          find /tmp/higgstools-v1.3 -iname '*Input*.py' -o -iname '*SLHA*.py'
          echo '=== EFFECTIVE COUPLING KEY/FLAGS CONTEXT ==='
          grep -R -n -C 8 --include='*.py' -E 'calcHgamgam|calcggH|effc_.*gamgam|gamgam.*effc' /tmp/higgstools-v1.3 | head -500 || :
          echo '=== PREDICTIONS FROM DICT ==='
          grep -R -n -C 4 --include='*.py' 'def predictionsFromDict' /tmp/higgstools-v1.3 | head -170 || :
