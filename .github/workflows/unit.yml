name: Physics unit checks
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy mpmath
      - run: python -m unittest discover -s Model -p 'test_*.py' -v
      - run: python -m unittest ZeeHiggs.test_spheno_audit ZeeHiggs.test_executed_higgstools_result ZeeHiggs.test_diagnose_h125 ZeeHiggs.test_loop_preserved_result ZeeHiggs.test_validate_reference ZeeHiggs.test_hdecay_sm_reference ZeeHiggs.test_reference_execution ZeeHiggs.test_higgs_subset_screen -v
      - run: python -m unittest Scan.test_diagnose_scalar_spectrum -v
      - run: python -m unittest Scan.test_calibrate_native_benchmark Flavor.test_bsgamma Flavor.test_validate_hepfit Flavor.test_bsgamma_screen -v
      - run: python -m unittest Neutrino.test_fit LFV.test_pilot LFV.test_constraints LFV.test_strict_2hdm_reference LFV.test_gauge_vertices LFV.test_approximation_study LFV.test_nonzero_mixing_study LFV.test_doublet_proxy_study Scan.test_native_pipeline Scan.test_physical_proposals Scan.test_spectrum_preflight -v
      - name: Execute source-authenticated conditional HiggsSignals NO/IO screen
        run: |
          python -m ZeeHiggs.higgs_subset_screen --output "$RUNNER_TEMP/s00017-higgs-subset-screen.json"
          python -m json.tool "$RUNNER_TEMP/s00017-higgs-subset-screen.json" > /dev/null
      - name: Archive executed HiggsSignals reference-screen result
        uses: actions/upload-artifact@v4
        with:
          name: s00017-higgs-sm-reference-2d-screen
          path: ${{ runner.temp }}/s00017-higgs-subset-screen.json
          if-no-files-found: error

